# config/packages/translation.yaml
framework:
    default_locale: en
    translator:
        default_path: '%kernel.project_dir%/translations'
        fallbacks:
            - en
            - fr

# Configuration pour les domaines de traduction
when@dev:
    framework:
        translator:
            providers:
                loco:
                    dsn: '%env(LOCO_DSN)%'
                crowdin:
                    dsn: '%env(CROWDIN_DSN)%'